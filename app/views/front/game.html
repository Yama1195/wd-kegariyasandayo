<!DOCTYPE html>
<html lang="ja">
<head>
 <title>毛刈り屋さんだよ</title>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">

 <link rel="stylesheet" href="../../assets/css/front/front.css">
 <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
 <script src="../../assets/js/front/front_game.js"></script>

 <style>
  body, html {
   width: 100%;
   height: 100%;
   overflow: hidden;
   touch-action: none;
   margin: 0;
   padding: 0;
   font-family: 'M PLUS Rounded 1c', sans-serif;
  }

  #game_canvas {
   display: block;
   width: 100vw;
   height: 100vh;
  }

  body::after {
   content: '';
   position: fixed;
   top: 0;
   left: 0;
   width: 100vw;
   height: 100vh;
   border: 8px solid rgba(255, 255, 255, 0.45);
   box-sizing: border-box;
   pointer-events: none;
   z-index: 999;
  }

  #rotate_warning {
   display: none;
   position: fixed;
   top: 0;
   left: 0;
   width: 100vw;
   height: 100vh;
   background-color: rgba(0, 0, 0, 0.9);
   z-index: 99999;
   flex-direction: column;
   justify-content: center;
   align-items: center;
   color: #fff;
   text-align: center;
   padding: 20px;
  }

  #rotate_warning .warning_icon {
   font-size: 4rem;
   margin-bottom: 20px;
   animation: rotate_anim 1.5s infinite ease-in-out;
  }

  #rotate_warning .warning_text {
   font-size: 1.2rem;
   font-weight: 800;
   line-height: 1.6;
  }

  @media screen and (max-width: 1024px) and (orientation: portrait) {
   #rotate_warning { display: flex !important; }
  }

  @keyframes rotate_anim {
   0% { transform: rotate(0deg); }
   50% { transform: rotate(90deg); }
   100% { transform: rotate(0deg); }
  }

  #start_panel {
   position: absolute !important;
   top: 0 !important;
   left: 0 !important;
   width: 100vw !important;
   height: 100vh !important;
   display: flex !important;
   flex-direction: column !important;
   justify-content: center !important;
   align-items: center !important;
   gap: 16px !important;
   z-index: 1000 !important;
   background-color: rgba(0, 0, 0, 0.35) !important;
   backdrop-filter: blur(2px) !important;
   margin: 0 !important;
   padding: 0 !important;
  }

  .hide, #start_panel.hide, #btn_start.hide {
   display: none !important;
  }

  .custom_start_btn {
   position: static !important;
   transform: none !important;
   margin: 0 !important;
   width: 240px !important;
   padding: 14px 0 !important;
   font-family: 'M PLUS Rounded 1c', sans-serif !important;
   font-size: 1.15rem !important;
   font-weight: 800 !important;
   color: #ffffff !important;
   border: 3px solid #FFFFFF !important;
   border-radius: 30px !important;
   cursor: pointer !important;
   box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25) !important;
   transition: transform 0.15s ease, opacity 0.2s !important;
   text-align: center !important;
  }

  .custom_start_btn:hover { transform: translateY(-3px) scale(1.03) !important; }
  .custom_start_btn:active { transform: translateY(1px) scale(0.97) !important; }

  #btn_start { background-color: #4CAF50 !important; }
  #btn_back_title { background-color: #757575 !important; }
 </style>
</head>
<body>

 <div id="rotate_warning">
  <div class="warning_icon">📱🔄</div>
  <div class="warning_text">
   画面を横向きにして遊んでね！<br>
   <span style="font-size: 0.9rem; color: #FF9800; font-weight: normal;">(スマートフォンを横に回転させてください)</span>
  </div>
 </div>

 <div id="start_panel">
  <button id="btn_start" class="custom_start_btn">ゲームスタート</button> 
  <button id="btn_back_title" class="custom_start_btn">タイトルへ戻る</button>
 </div>

 <canvas id="game_canvas"></canvas>

 <script>
  $(function() {
   $(document).on('click', '#btn_back_title', function(e) {
     e.stopPropagation();
     window.location.href = '../../../index.html';
   });
  });
 </script>
</body>
</html>
