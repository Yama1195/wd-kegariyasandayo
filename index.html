<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>毛刈り屋さんだよ～</title>
    
    <!-- Google Fonts: ポップで可愛い丸ゴシック「M PLUS Rounded 1c」を読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            /* 全体のフォントを丸ゴシックに変更 */
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #B3E5FC;
            overflow: hidden;
            user-select: none;
            position: relative;
            touch-action: none;
        }

        /* --- 画面回転アラート --- */
        #rotate_warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        #rotate_warning .warning_icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: rotate_anim 1.5s infinite ease-in-out;
        }

        #rotate_warning .warning_text {
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1.6;
        }

        @media screen and (max-width: 1024px) and (orientation: portrait) {
            #rotate_warning {
                display: flex !important;
            }
        }

        @keyframes rotate_anim {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* --- 背景装飾：流れる雲 --- */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 50px;
            z-index: 1;
            animation: moveCloud linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 50%;
        }
        .cloud1 { width: 120px; height: 40px; top: 10%; left: -150px; animation-duration: 25s; }
        .cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
        .cloud1::after { width: 40px; height: 40px; top: -15px; left: 55px; }

        .cloud2 { width: 160px; height: 50px; top: 22%; left: -200px; animation-duration: 35s; animation-delay: 10s; }
        .cloud2::before { width: 60px; height: 60px; top: -25px; left: 25px; }
        .cloud2::after { width: 50px; height: 50px; top: -20px; left: 70px; }

        .cloud3 { width: 100px; height: 35px; top: 5%; left: -120px; animation-duration: 20s; animation-delay: 5s; }
        .cloud3::before { width: 40px; height: 40px; top: -15px; left: 15px; }
        .cloud3::after { width: 35px; height: 35px; top: -10px; left: 45px; }

        @keyframes moveCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 300px)); }
        }

        /* --- 背景装飾：草原 --- */
        .grassland {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            background-color: #8BC34A;
            z-index: 2;
            border-top-left-radius: 50% 20px;
            border-top-right-radius: 50% 20px;
        }

        /* --- 背景装飾：PNG画像 --- */
        .scattered-img {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            opacity: 0.85;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.18));
            object-fit: contain;
            max-width: 18vw;
        }

        .rot-1 { transform: rotate(-20deg); }
        .rot-2 { transform: rotate(25deg); }
        .rot-3 { transform: scaleX(-1) rotate(-30deg); }
        .rot-4 { transform: scaleX(-1) rotate(20deg); }
        .rot-5 { transform: rotate(-40deg); }
        .rot-6 { transform: rotate(35deg); }

        /* --- メインコンテンツカード --- */
        .game-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.94);
            padding: 35px 45px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            max-width: 480px;
            width: 85%;
            border: 4px solid #FFF;
        }

        h1 {
            color: #E91E63;
            font-size: clamp(1.6rem, 3.8vw, 2.5rem);
            font-weight: 800;
            margin: 0 0 8px 0;
            /* 文字に立体的なフチと影をつけて絵本風に */
            text-shadow: 2px 2px 0 #FFE0B2, 4px 4px 0 rgba(0,0,0,0.08);
        }

        .subtitle {
            color: #555;
            font-size: clamp(0.9rem, 1.9vw, 1.05rem);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        .btn {
            width: 230px;
            height: 48px;
            line-height: 48px;
            border: none;
            border-radius: 24px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s;
            outline: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .btn:hover {
            opacity: 0.92;
            transform: translateY(-3px) scale(1.02);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn-start {
            background-color: #4CAF50;
        }

        .btn-tutorial {
            background-color: #FF9800;
        }

        .btn-howTo {
            background-color: #00BCD4;
        }

        /* --- あそびかたモーダル --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            max-width: 440px;
            width: 85%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
            color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 4px solid #FF9800;
        }

        .modal-title {
            font-size: 1.35rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px dashed #FFCC80;
            color: #FF9800;
            text-align: center;
        }

        .modal-list {
            padding-left: 20px;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .modal-list li {
            margin-bottom: 10px;
        }

        .highlight {
            color: #FF5722;
            font-weight: 800;
        }

        .btn-close {
            display: block;
            margin: 0 auto;
            width: 130px;
            height: 42px;
            line-height: 42px;
            background-color: #757575;
            color: white;
            border: none;
            border-radius: 21px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-close:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        @media screen and (max-height: 500px) {
            .game-container {
                padding: 15px 25px;
            }
            h1 { font-size: 1.3rem; margin-bottom: 4px; }
            .subtitle { font-size: 0.8rem; margin-bottom: 12px; }
            .btn { height: 40px; line-height: 40px; font-size: 0.95rem; }
            .button-group { gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- スマホ縦向き時の回転アラート -->
    <div id="rotate_warning">
        <div class="warning_icon">📱🔄</div>
        <div class="warning_text">
            画面を横向きにして遊んでね！<br>
            <span style="font-size: 0.9rem; color: #FF9800; font-weight: normal;">(スマートフォンを横に回転させてください)</span>
        </div>
    </div>

    <!-- 背景装飾：流れる雲 -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <!-- 背景装飾：草原 -->
    <div class="grassland"></div>

    <!-- 背景装飾：PNG画像アセット -->
    <img src="./app/assets/img/player1_attack.png" class="scattered-img rot-1" style="top: 10%; left: 12%; width: 170px;" alt="player">
    <img src="./app/assets/img/enemy1.png" class="scattered-img rot-2" style="top: 8%; right: 12%; width: 160px;" alt="enemy">
    <img src="./app/assets/img/player1_attack.png" class="scattered-img rot-3" style="bottom: 10%; left: 14%; width: 180px;" alt="player">
    <img src="./app/assets/img/enemy1.png" class="scattered-img rot-4" style="bottom: 8%; right: 15%; width: 170px;" alt="enemy">
    <img src="./app/assets/img/enemy1.png" class="scattered-img rot-5" style="top: 40%; left: 6%; width: 140px;" alt="enemy">
    <img src="./app/assets/img/player1_attack.png" class="scattered-img rot-6" style="top: 38%; right: 7%; width: 150px;" alt="player">

    <!-- メインコンテンツ -->
    <div class="game-container">
        <h1>毛刈り屋さんだよ～</h1>
        <div class="subtitle">タイミングよく毛を刈り取ろう！</div>

        <div class="button-group">
            <button id="btn_tutorial" class="btn btn-tutorial">チュートリアル</button>
            <button id="btn_start" class="btn btn-start">ゲームスタート</button>
            <button id="btn_howTo" class="btn btn-howTo">あそびかた</button>
        </div>
    </div>

    <!-- あそびかたモーダル -->
    <div id="modal" class="modal-overlay">
        <div class="modal-body">
            <div class="modal-title">あそびかた</div>
            <ul class="modal-list">
                <li>
                    <span class="highlight">スペースキー</span> または <span class="highlight">画面クリック</span> で毛刈りアクションを行います。
                </li>
                <li>
                    左から走ってくる敵が、<span class="highlight">自分に近づいたタイミング</span> で毛を刈り取りましょう。
                </li>
                <li>
                    タイミングが合うと「毛刈り成功」となりスコアが増えます。連続で成功させるとコンボ数が加算されます。
                </li>
                <li>
                    ぶつかると「たいりょく」が減り、0になるとゲームオーバーです。
                </li>
            </ul>
            <button id="btn_close" class="btn-close">とじる</button>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function() {
            $('#btn_start').on('click', function() {
                window.location.href = './app/views/front/game.html';
            });

            $('#btn_tutorial').on('click', function() {
                window.location.href = './app/views/front/tutorial.html';
            });

            $('#btn_howTo').on('click', function() {
                $('#modal').addClass('active');
            });

            $('#btn_close, #modal').on('click', function(e) {
                if (e.target === this) {
                    $('#modal').removeClass('active');
                }
            });
        });
    </script>
</body>
</html>
